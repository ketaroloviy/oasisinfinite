<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Oasis Infinite</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --gold: #d9a21b; --diamond: #43d1ee; --card: rgba(127, 127, 127, 0.16); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #f5e6c8);
      color: var(--tg-theme-text-color, #3b2f1e);
      -webkit-user-select: none; user-select: none;
    }
    .app {
      height: 100%; display: flex; flex-direction: column;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
    }
    .top { display: flex; align-items: center; gap: 10px; }
    .lvl { font-weight: 700; min-width: 64px; }
    .bar { flex: 1; height: 10px; border-radius: 6px; background: var(--card); overflow: hidden; }
    .bar > div { height: 100%; width: 0%; background: var(--gold); transition: width .2s; }
    .xp { font-size: 12px; opacity: .7; min-width: 64px; text-align: right; }
    .res { display: flex; gap: 10px; margin-top: 12px; }
    .chip { flex: 1; background: var(--card); border-radius: 14px; padding: 10px 12px; }
    .chip small { display: block; opacity: .7; font-size: 12px; }
    .chip b { font-size: 22px; }
    .chip .gps { font-size: 12px; opacity: .8; margin-left: 4px; }
    .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .vname { font-size: 18px; font-weight: 600; min-height: 24px; }
    .rock {
      --s: 160px; width: var(--s); height: var(--s); border-radius: 46% 54% 50% 50% / 55% 48% 52% 45%;
      border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
      box-shadow: inset -10px -14px 24px rgba(0,0,0,.28), 0 10px 22px rgba(0,0,0,.25);
      transition: transform .06s;
    }
    .rock:active { transform: scale(.93); }
    .v0 { --s: 140px; background: radial-gradient(circle at 35% 30%, #b9a58f, #7d6a57); }
    .v1 { --s: 152px; background: radial-gradient(circle at 35% 30%, #d2b98a, #8f7347); }
    .v2 { --s: 164px; background: radial-gradient(circle at 35% 30%, #f0d36a, #a8801a); }
    .v3 { --s: 176px; background: radial-gradient(circle at 35% 30%, #ffe27a, #c78b00); }
    .v4 { --s: 160px; background: radial-gradient(circle at 35% 30%, #d9fbff, #25a9c9);
          box-shadow: inset -10px -14px 24px rgba(0,0,0,.25), 0 0 34px rgba(67,209,238,.65); }
    .pips { display: flex; gap: 8px; }
    .pip { width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: background .1s; }
    .pip.on { background: var(--gold); }
    .panel { background: var(--card); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .panel .head { display: flex; justify-content: space-between; font-size: 14px; }
    .panel .head span:last-child { opacity: .75; }
    .row { display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 12px 8px; border: 0; border-radius: 12px; font-weight: 700; font-size: 15px;
      background: var(--gold); color: #2b1f06; cursor: pointer; touch-action: manipulation;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    #status { min-height: 18px; text-align: center; font-size: 13px; opacity: .8; margin-top: 8px; }
    .float {
      position: fixed; pointer-events: none; font-weight: 700; font-size: 22px;
      color: var(--gold); text-shadow: 0 1px 2px rgba(0,0,0,.35);
      animation: up .7s ease-out forwards; transform: translate(-50%, -50%);
    }
    .float.dia { color: var(--diamond); }
    @keyframes up { to { transform: translate(-50%, -120px); opacity: 0; } }

    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .view[hidden] { display: none; }
    #fever { min-height: 20px; font-size: 14px; font-weight: 700; color: var(--diamond); text-align: center; }
    #smelterNote { font-size: 13px; opacity: .85; text-align: center; min-height: 18px; }
    .nav { display: flex; gap: 8px; margin-top: 8px; }
    .tab {
      flex: 1; padding: 11px; border: 0; border-radius: 12px; background: var(--card);
      color: inherit; font-weight: 700; font-size: 15px; cursor: pointer; touch-action: manipulation;
    }
    .tab.on { background: var(--gold); color: #2b1f06; }
    #treeList { flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
    .bonuses { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; white-space: pre-line; }
    .shead { display: flex; gap: 8px; align-items: baseline; margin: 14px 2px 6px; }
    .shead b { font-size: 16px; }
    .shead span { font-size: 12px; opacity: .7; }
    .shead .cnt { margin-left: auto; }
    .node { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
    .node.owned { opacity: .6; }
    .node.locked { opacity: .5; }
    .ninfo { flex: 1; min-width: 0; }
    .ninfo b { display: block; font-size: 14px; }
    .ninfo .eff { font-size: 13px; }
    .ninfo .why { display: block; font-size: 12px; opacity: .75; }
    .btn.small { flex: none; min-width: 96px; padding: 9px 10px; font-size: 13px; }
    .btn.dia { background: var(--diamond); color: #04323d; }
    .coin {
      --s: 140px; width: var(--s); height: var(--s); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 800; color: #2d3440;
      box-shadow: inset -8px -10px 18px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.25);
    }
    .coin.empty { background: transparent; border: 3px dashed rgba(127,127,127,.5); box-shadow: none; }
    .c0 { --s: 110px; background: radial-gradient(circle at 35% 30%, #f4f6f8, #a2abb5); }
    .c1 { --s: 124px; background: radial-gradient(circle at 35% 30%, #f4f6f8, #98a2ad); }
    .c2 { --s: 138px; background: radial-gradient(circle at 35% 30%, #ffffff, #8e99a6); }
    .c3 { --s: 152px; background: radial-gradient(circle at 35% 30%, #ffffff, #7f8d9c); }
    .c4 { --s: 140px; background: radial-gradient(circle at 35% 30%, #d9fbff, #25a9c9); color: #04323d;
          box-shadow: inset -8px -10px 18px rgba(0,0,0,.2), 0 0 30px rgba(67,209,238,.65); }
    .cool { width: 70%; height: 10px; border-radius: 6px; background: var(--card); overflow: hidden; }
    #coolBar { height: 100%; width: 0; background: #5bbcff; transition: width .25s linear; }
    #smBanner { min-height: 22px; font-weight: 700; color: #d9534f; }
    #smHint { min-height: 20px; opacity: .85; text-align: center; }
    .lockedBox { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; line-height: 1.5; opacity: .8; }
    .lockedBox[hidden] { display: none; }
    .chip[hidden] { display: none; }
    .tab[hidden] { display: none; }
    .tab { font-size: 13px; padding: 11px 4px; }
    input { -webkit-user-select: text; user-select: text; }
    .adminBox { flex: 1; min-height: 0; overflow-y: auto; margin-top: 10px; padding-bottom: 6px; }
    #admTarget { width: 100%; padding: 11px 12px; border: 0; border-radius: 12px; background: var(--card); color: inherit; font-size: 15px; }
    #admMsg { min-height: 20px; margin: 8px 2px 0; font-size: 13px; opacity: .85; }
    .admRow { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
    .admHead { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .admHead span { opacity: .8; }
    .admCtl { display: flex; gap: 6px; }
    .admCtl input { flex: 1; min-width: 0; padding: 9px 10px; border: 0; border-radius: 10px; background: rgba(127,127,127,.2); color: inherit; font-size: 15px; }
    .admCtl .btn { flex: none; min-width: 0; padding: 9px 10px; font-size: 13px; }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal[hidden] { display: none; }
    .card {
      background: var(--tg-theme-bg-color, #f5e6c8); color: var(--tg-theme-text-color, #3b2f1e);
      border-radius: 18px; padding: 20px; max-width: 340px; width: 100%; text-align: center;
    }
    .card h3 { margin: 0 0 10px; }
    .card p { margin: 0 0 16px; line-height: 1.4; }
    .card .note { font-size: 13px; opacity: .75; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="lvl" id="level">Ур. 1</div>
      <div class="bar"><div id="xpbar"></div></div>
      <div class="xp" id="xptext">0 / 25</div>
    </div>
    <div class="res">
      <div class="chip"><small>Золото <span class="gps" id="gps"></span></small><b id="gold">0</b></div>
      <div class="chip" id="aksumChip" hidden><small>Аксумм <span class="gps" id="aps"></span></small><b id="aksum">0</b></div>
      <div class="chip"><small>Самородки</small><b id="nuggets">0</b></div>
    </div>
    <div class="view" id="viewMine">
      <div class="stage">
        <div id="fever"></div>
        <div class="vname" id="vname"></div>
        <button class="rock v0" id="rock" aria-label="Жила"></button>
        <div class="pips" id="pips"></div>
        <div id="smelterNote"></div>
      </div>
      <div class="panel">
        <div class="head"><span id="minersTitle">Шахтёры</span><span id="minersInfo"></span></div>
        <div class="row">
          <button class="btn" id="hire1" disabled>Нанять</button>
          <button class="btn" id="hireMax" disabled>Нанять ещё</button>
        </div>
      </div>
    </div>
    <div class="view" id="viewSmelter" hidden>
      <div class="lockedBox" id="smLocked">Плавильня закрыта.<br>Купи талант «Ключ от плавильни» в древе рудника.</div>
      <div class="view" id="smMain" hidden>
        <div class="stage">
          <div id="smBanner"></div>
          <div class="coin empty" id="coin"><span id="coinText"></span></div>
          <div class="cool"><div id="coolBar"></div></div>
          <div id="smHint"></div>
        </div>
        <div class="row" style="margin-bottom: 8px">
          <button class="btn" id="btnCast">Отлить</button>
          <button class="btn" id="btnCool">Остудить</button>
          <button class="btn" id="btnPolish">Отполировать</button>
        </div>
        <div class="panel">
          <div class="head"><span id="smithsTitle">Кузнецы</span><span id="smithsInfo"></span></div>
          <div class="row">
            <button class="btn" id="hireSmith1" disabled>Нанять</button>
            <button class="btn" id="hireSmithMax" disabled>Нанять ещё</button>
          </div>
        </div>
      </div>
    </div>
    <div class="view" id="viewAdmin" hidden>
      <div class="adminBox">
        <select id="admTarget"><option value="self">Я</option></select>
        <div id="admMsg"></div>
        <div id="admFields"></div>
      </div>
    </div>
    <div class="view" id="viewTree" hidden>
      <div id="treeList"></div>
    </div>
    <div id="status">Загрузка...</div>
    <div class="nav">
      <button class="tab on" id="tabMine">Рудник</button>
      <button class="tab" id="tabSmelter">Плавильня</button>
      <button class="tab" id="tabTree">Древо</button>
      <button class="tab" id="tabAdmin" hidden>Админ</button>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="card">
      <h3>Пока тебя не было</h3>
      <p id="modalText"></p>
      <button class="btn" id="modalOk" style="width:100%">Отлично</button>
    </div>
  </div>

  <script type="module">
    import { levelInfo, applyClicks, minerPrice, minersCost, workerPrice, workersCost } from './core.js';
    import { NODES, BRANCH_INFO, NODE_BY_ID, checkBuy } from './talents.js';
    import { CURRENCIES } from './currencies.js';

    const tg = window.Telegram && window.Telegram.WebApp;
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');

    if (!tg || !tg.initData) {
      statusEl.textContent = 'Открой игру через Telegram';
      throw new Error('no telegram');
    }
    tg.ready();
    tg.expand();

    let S = null;        // последнее подтверждённое сервером состояние
    let mine = null;     // настройки рудника с сервера
    let mods = null;     // бонусы игрока с сервера
    let syncAt = 0;      // когда получили S (для плавного роста золота от шахтёров)
    let unsent = 0;      // клики, ещё не отправленные
    let inflight = 0;    // клики, отправленные и ждущие ответа
    let lastTap = 0;
    let smelterCfg = null; // настройки плавильни с сервера
    let smBusy = false;
    let isAdmin = false;   // сервер сообщает, админ ли ты
    let admTarget = null;  // null = я, иначе id другого игрока
    let admView = null;    // состояние выбранного другого игрока
    let admBuilt = false;
    let admBusy = false;
    let clockOffset = 0; // разница между часами сервера и телефона
    let view = 'mine';
    let treeBuilt = false;
    const nodeEls = {};

    // Все запросы к серверу идут строго по очереди.
    let chain = Promise.resolve();
    function enqueue(fn) {
      const p = chain.then(fn);
      chain = p.catch(() => {});
      return p;
    }

    async function api(path, method, body, keepalive) {
      const res = await fetch(path, {
        method,
        headers: { Authorization: 'tma ' + tg.initData, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
        keepalive: !!keepalive,
      });
      let data = null;
      try { data = await res.json(); } catch (e) { /* ответ не JSON */ }
      if (!res.ok) {
        const err = new Error('HTTP ' + res.status + (data && data.reason ? ' ' + data.reason : ''));
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function fmt(n) {
      if (n >= 1000) return Math.floor(n).toLocaleString('ru-RU');
      return (Math.round(n * 10) / 10).toString().replace('.', ',');
    }

    function fmtDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      if (h > 0) return h + ' ч ' + m + ' мин';
      if (m > 0) return m + ' мин';
      return Math.max(1, Math.floor(sec)) + ' с';
    }

    function applyServer(data) {
      S = data.player;
      mods = data.mods;
      if (data.mine) mine = data.mine;
      if (data.smelter) smelterCfg = data.smelter;
      if (data.isAdmin !== undefined) isAdmin = !!data.isAdmin;
      syncAt = performance.now();
      if (data.serverTime) clockOffset = data.serverTime - Date.now();
      if (data.idle) maybeShowIdle(data.idle);
    }

    function feverLeft() {
      if (!mods || !mods.fever || !S) return 0;
      return Math.max(0, (S.feverUntil - (Date.now() + clockOffset)) / 1000);
    }

    // Бонусы с учётом алмазной лихорадки, если она сейчас идёт.
    function effMods() {
      const f = feverLeft() > 0 ? mine.feverMult : 1;
      return { clickGold: mods.clickGold * f, minerGold: mods.minerGold * f, xpMult: mods.xpMult };
    }

    function maybeShowIdle(idle) {
      if (idle.seconds < 60 || (!(idle.gold > 0) && !(idle.aksum > 0)) || !$('modal').hidden) return;
      const parts = [];
      if (idle.gold > 0) parts.push('шахтёры принесли ' + fmt(idle.gold) + ' золота');
      if (idle.aksum > 0) parts.push('кузнецы выплавили ' + fmt(idle.aksum) + ' Аксуммов');
      let text = 'Пока тебя не было ' + fmtDuration(idle.credited) + ': ' + parts.join(', ') + '.';
      if (idle.capped) {
        text += '<br><span class="note">Тебя не было дольше ' + fmtDuration(mine.offlineCapSeconds) +
                ', больше доход не копится.</span>';
      }
      $('modalText').innerHTML = text;
      $('modal').hidden = false;
    }

    // Что показываем: подтверждённое состояние, клики, ещё не подтверждённые сервером,
    // и золото, которое шахтёры принесли с момента последней синхронизации.
    function display() {
      const d = { gold: S.gold, xp: S.xp, nuggets: S.nuggets, queue: S.queue.slice(), hits: S.hits, miners: S.miners,
                  aksum: S.aksum, smiths: S.smiths };
      const em = effMods();
      const pending = inflight + unsent;
      if (pending) applyClicks(d, pending, mine, em, () => 0);
      const sec = Math.min(120, (performance.now() - syncAt) / 1000);
      d.gold += S.miners * em.minerGold * sec;
      d.aksum += S.smiths * mods.smithAksum * sec;
      return d;
    }

    function maxAffordable(d) {
      const room = mine.minerMax - d.miners;
      let c = 0;
      while (c < room && minersCost(mine, d.miners, c + 1) <= d.gold) c++;
      return c;
    }

    function render() {
      if (!S) return;
      const d = display();
      const li = levelInfo(d.xp);
      $('level').textContent = 'Ур. ' + li.level;
      $('xpbar').style.width = Math.min(100, (li.into / li.need) * 100) + '%';
      $('xptext').textContent = Math.floor(li.into) + ' / ' + li.need;
      $('gold').textContent = fmt(d.gold);
      $('nuggets').textContent = d.nuggets;

      const em = effMods();
      const gps = d.miners * em.minerGold;
      $('gps').textContent = gps > 0 ? '+' + fmt(gps) + '/с' : '';

      const vein = mine.veins[d.queue[0]];
      if (vein) {
        $('rock').className = 'rock v' + vein.id;
        $('vname').textContent = vein.name + ' жила';
      }
      const pips = $('pips').children;
      for (let i = 0; i < pips.length; i++) pips[i].classList.toggle('on', i < d.hits);

      const left = feverLeft();
      $('fever').textContent = left > 0 ? 'Алмазная лихорадка ×' + mine.feverMult + ' · ' + Math.ceil(left) + ' с' : '';
      $('smelterNote').textContent = S.smelterUnlocked ? 'Плавильня открыта: загляни во вкладку «Плавильня».' : '';

      // панель шахтёров
      $('minersTitle').textContent = 'Шахтёры: ' + d.miners + ' / ' + mine.minerMax;
      $('minersInfo').textContent = gps > 0 ? fmt(gps) + ' золота в секунду' : 'ещё никого нет';
      const full = d.miners >= mine.minerMax;
      const price = minerPrice(mine, d.miners);
      $('hire1').textContent = full ? 'Максимум' : 'Нанять · ' + fmt(price);
      $('hire1').disabled = full || d.gold < price;
      const c = maxAffordable(d);
      $('hireMax').textContent = c >= 2 ? 'Нанять ×' + c + ' · ' + fmt(minersCost(mine, d.miners, c)) : 'Нанять несколько';
      $('hireMax').disabled = c < 2;

      const unlocked = !!S.smelterUnlocked;
      $('aksumChip').hidden = !unlocked;
      if (unlocked) {
        $('aksum').textContent = fmt(d.aksum);
        const aps = d.smiths * mods.smithAksum;
        $('aps').textContent = aps > 0 ? '+' + fmt(aps) + '/с' : '';
      }
      $('tabAdmin').hidden = !isAdmin;
      if (view === 'tree') updateTree(d);
      else if (view === 'smelter') updateSmelter(d);
      else if (view === 'admin') updateAdmin();
    }


    function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

    function buildTree() {
      const root = $('treeList');
      const box = document.createElement('div');
      box.className = 'bonuses';
      box.id = 'bonuses';
      root.appendChild(box);
      for (const br of BRANCH_INFO) {
        const head = document.createElement('div');
        head.className = 'shead';
        head.innerHTML = '<b></b><span></span><span class="cnt"></span>';
        head.children[0].textContent = br.name;
        head.children[1].textContent = br.desc;
        root.appendChild(head);
        nodeEls['cnt_' + br.id] = head.children[2];
        for (const n of NODES.filter((x) => x.branch === br.id)) {
          const card = document.createElement('div');
          card.className = 'node';
          card.innerHTML = '<div class="ninfo"><b></b><span class="eff"></span><span class="why"></span></div>' +
                           '<button class="btn small"></button>';
          card.querySelector('b').textContent = n.name;
          card.querySelector('.eff').textContent = n.text;
          const btn = card.querySelector('button');
          btn.dataset.id = n.id;
          if (n.cost.nuggets !== undefined) btn.classList.add('dia');
          root.appendChild(card);
          nodeEls[n.id] = { card, why: card.querySelector('.why'), btn };
        }
      }
      root.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-id]');
        if (btn && !btn.disabled) buyTalent(btn.dataset.id);
      });
      treeBuilt = true;
    }

    function priceLabel(n) {
      return n.cost.nuggets !== undefined ? n.cost.nuggets + ' ◆' : fmt(n.cost.gold) + ' зол.';
    }

    function updateTree(d) {
      if (!treeBuilt) return;
      const level = levelInfo(d.xp).level;
      const owned = S.talents;
      const counts = {};
      const total = {};
      for (const n of NODES) {
        total[n.branch] = (total[n.branch] || 0) + 1;
        if (owned.includes(n.id)) counts[n.branch] = (counts[n.branch] || 0) + 1;
        const el = nodeEls[n.id];
        const err = checkBuy(n, owned, level, d.gold, d.nuggets);
        let cls = 'node';
        let why = '';
        if (err === 'owned') cls += ' owned';
        else if (err === 'requires' || err === 'level') cls += ' locked';
        if (err === 'requires') {
          const missing = n.req.filter((r) => !owned.includes(r));
          why = n.id === 'final'
            ? 'Нужны все остальные таланты (осталось ' + missing.length + ')'
            : 'Сначала: ' + missing.slice(0, 2).map((r) => NODE_BY_ID[r].name).join(', ');
        } else if (err === 'level') why = 'Нужен уровень ' + n.level;
        else if (err === 'funds') why = n.cost.nuggets !== undefined ? 'Не хватает самородков' : 'Не хватает золота';
        if (el.card.className !== cls) el.card.className = cls;
        setText(el.why, why);
        setText(el.btn, err === 'owned' ? 'Куплено' : priceLabel(n));
        el.btn.disabled = err !== null;
      }
      for (const br of BRANCH_INFO) setText(nodeEls['cnt_' + br.id], (counts[br.id] || 0) + ' / ' + total[br.id]);

      const em = mods;
      setText($('bonuses'),
        'Золото за клик (малая жила): ' + fmt(em.clickGold) + '\n' +
        'Один шахтёр: ' + fmt(em.minerGold) + ' золота в секунду\n' +
        'Опыт: ×' + String(Math.round(em.xpMult * 100) / 100).replace('.', ',') + '\n' +
        'Шанс удвоить самородки: ' + Math.round(em.doubleNugget * 100) + '%');
    }

    async function buyTalent(id) {
      await flush();
      await enqueue(async () => {
        try {
          applyServer(await api('/api/talent', 'POST', { id }));
          statusEl.textContent = id === 'final' ? 'Плавильня открыта!' : '';
        } catch (err) {
          const code = err.data && err.data.error;
          statusEl.textContent =
            code === 'requires' ? 'Сначала нужны предыдущие таланты' :
            code === 'level' ? 'Не хватает уровня' :
            code === 'funds' ? 'Не хватает ресурсов' :
            code === 'owned' ? 'Уже куплено' : 'Не удалось купить';
          await doSync();
        }
        render();
      });
    }

    function showView(name) {
      view = name;
      $('viewMine').hidden = name !== 'mine';
      $('viewSmelter').hidden = name !== 'smelter';
      $('viewAdmin').hidden = name !== 'admin';
      $('viewTree').hidden = name !== 'tree';
      $('tabMine').classList.toggle('on', name === 'mine');
      $('tabSmelter').classList.toggle('on', name === 'smelter');
      $('tabTree').classList.toggle('on', name === 'tree');
      $('tabAdmin').classList.toggle('on', name === 'admin');
      if (name === 'tree' && !treeBuilt) buildTree();
      if (name === 'admin' && isAdmin) {
        if (!admBuilt) buildAdmin();
        loadAdminPlayers();
        if (admTarget !== null) admApply([]);
      }
      render();
    }


    function maxAffordableSmiths(d) {
      const room = smelterCfg.smithMax - d.smiths;
      let c = 0;
      while (c < room && workersCost(smelterCfg.smithBaseCost, smelterCfg.smithGrowth, d.smiths, c + 1) <= d.aksum) c++;
      return c;
    }

    function updateSmelter(d) {
      const unlocked = !!S.smelterUnlocked;
      $('smLocked').hidden = unlocked;
      $('smMain').hidden = !unlocked;
      if (!unlocked) return;

      const sm = S.smelter;
      const now = Date.now() + clockOffset;
      const lockLeft = Math.max(0, (sm.lockUntil - now) / 1000);
      const coin = sm.coin >= 0 ? smelterCfg.coins[sm.coin] : null;

      const coinCls = 'coin ' + (coin ? 'c' + coin.id : 'empty');
      if ($('coin').className !== coinCls) $('coin').className = coinCls;
      setText($('coinText'), coin ? (coin.nuggets ? '◆' : String(coin.nominal)) : '');

      let pct = 0;
      let hint = 'Нажми «Отлить»';
      if (sm.stage === 1) hint = 'Теперь «Остудить»';
      if (sm.stage === 2) {
        const total = mods.coolSeconds * 1000;
        const leftMs = sm.readyAt - now;
        pct = Math.max(0, Math.min(100, (1 - leftMs / total) * 100));
        hint = leftMs <= 0 ? 'Готово: «Отполировать»' : 'Остывает...';
      }
      $('coolBar').style.width = pct + '%';
      if (lockLeft > 0) {
        setText($('smBanner'), 'Плавильня остановлена: ' + Math.ceil(lockLeft) + ' с');
        hint = '';
      } else {
        setText($('smBanner'), '');
      }
      setText($('smHint'), hint);

      const off = lockLeft > 0 || smBusy;
      $('btnCast').disabled = off;
      $('btnCool').disabled = off;
      $('btnPolish').disabled = off;

      // кузнецы
      const full = d.smiths >= smelterCfg.smithMax;
      const price = workerPrice(smelterCfg.smithBaseCost, smelterCfg.smithGrowth, d.smiths);
      setText($('smithsTitle'), 'Кузнецы: ' + d.smiths + ' / ' + smelterCfg.smithMax);
      const aps = d.smiths * mods.smithAksum;
      setText($('smithsInfo'), aps > 0 ? fmt(aps) + ' Аксумма в секунду' : 'ещё никого нет');
      setText($('hireSmith1'), full ? 'Максимум' : 'Нанять · ' + fmt(price));
      $('hireSmith1').disabled = full || d.aksum < price;
      const c = maxAffordableSmiths(d);
      setText($('hireSmithMax'), c >= 2
        ? 'Нанять ×' + c + ' · ' + fmt(workersCost(smelterCfg.smithBaseCost, smelterCfg.smithGrowth, d.smiths, c))
        : 'Нанять несколько');
      $('hireSmithMax').disabled = c < 2;
    }

    function showReward(reward) {
      const r = $('coin').getBoundingClientRect();
      const x = r.left + r.width / 2;
      const y = r.top + r.height / 2;
      if (reward.nuggets > 0) floatText(x, y, '+' + reward.nuggets + ' ◆', true);
      else floatText(x, y, '+' + fmt(reward.aksum), false);
    }

    async function smeltAction(action) {
      if (smBusy || !S) return;
      smBusy = true;
      render();
      await flush();
      await enqueue(async () => {
        try {
          const data = await api('/api/smelter', 'POST', { action });
          applyServer(data);
          if (data.violation) {
            const secs = Math.round((S.smelter.lockUntil - (Date.now() + clockOffset)) / 1000);
            statusEl.textContent = 'Нарушен порядок! Плавильня остановлена на ' + secs + ' с';
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
          } else {
            statusEl.textContent = '';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (data.reward) showReward(data.reward);
          }
        } catch (err) {
          const code = err.data && err.data.error;
          statusEl.textContent =
            code === 'locked' ? 'Плавильня остановлена, подожди' :
            code === 'locked_feature' ? 'Плавильня ещё закрыта' : 'Нет связи, попробуй ещё раз';
          await doSync();
        }
      });
      smBusy = false;
      render();
    }

    async function hireSmith(count) {
      await flush();
      await enqueue(async () => {
        try {
          applyServer(await api('/api/smith', 'POST', { count }));
          statusEl.textContent = '';
        } catch (err) {
          const code = err.data && err.data.error;
          statusEl.textContent =
            code === 'not_enough_aksum' ? 'Не хватает Аксуммов' :
            code === 'limit' ? 'Больше нанять нельзя' : 'Не удалось нанять';
          await doSync();
        }
        render();
      });
    }


    // ---------- админ-панель (доступна только по ADMIN_ID на сервере) ----------
    const fmtExact = (n) => Number(n.toFixed(2)).toLocaleString('ru-RU');
    const admMsg = (t) => { $('admMsg').textContent = t; };

    function admSrc() { return admTarget === null ? S : admView; }

    function updateAdmin() {
      const src = admSrc();
      for (const c of CURRENCIES) {
        const el = document.querySelector('.admRow[data-id="' + c.id + '"] .admVal');
        if (!el) continue;
        let text = '—';
        if (src) text = c.isLevel ? String(levelInfo(src.xp).level) : fmtExact(src[c.key]);
        setText(el, text);
      }
    }

    function buildAdmin() {
      const box = $('admFields');
      for (const c of CURRENCIES) {
        const row = document.createElement('div');
        row.className = 'admRow';
        row.dataset.id = c.id;
        row.innerHTML = '<div class="admHead"><b></b><span class="admVal"></span></div>' +
          '<div class="admCtl"><input type="text" inputmode="decimal" placeholder="число">' +
          '<button class="btn" data-mode="set">Задать</button><button class="btn" data-mode="add">Добавить</button></div>';
        row.querySelector('b').textContent = c.name;
        box.appendChild(row);
      }
      box.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-mode]');
        if (!btn) return;
        const row = btn.closest('.admRow');
        const input = row.querySelector('input');
        const v = parseFloat(input.value.replace(',', '.').replace(/\s/g, ''));
        if (!Number.isFinite(v)) { admMsg('Введи число'); return; }
        admApply([{ field: row.dataset.id, mode: btn.dataset.mode, value: v }]);
        input.value = '';
      });
      $('admTarget').addEventListener('change', () => {
        const v = $('admTarget').value;
        admTarget = v === 'self' ? null : Number(v);
        admView = null;
        admMsg('');
        if (admTarget !== null) admApply([]);
        render();
      });
      admBuilt = true;
    }

    async function loadAdminPlayers() {
      try {
        const data = await api('/api/admin/players', 'GET');
        const sel = $('admTarget');
        const keep = sel.value;
        sel.innerHTML = '<option value="self">Я</option>';
        for (const p of data.players) {
          if (p.isMe) continue;
          const o = document.createElement('option');
          o.value = String(p.id);
          o.textContent = p.name + ' · ур. ' + p.level + ' · ' + p.id;
          sel.appendChild(o);
        }
        if ([...sel.options].some((o) => o.value === keep)) sel.value = keep;
      } catch (err) {
        admMsg('Не удалось загрузить игроков');
      }
    }

    async function admApply(changes) {
      if (admBusy || !S) return;
      admBusy = true;
      await flush();
      await enqueue(async () => {
        try {
          const data = await api('/api/admin/adjust', 'POST', { target: admTarget === null ? undefined : admTarget, changes });
          if (admTarget === null) applyServer(data);
          else admView = data.player;
          admMsg(changes.length ? 'Готово' : '');
        } catch (err) {
          const code = err.data && err.data.error;
          admMsg(code === 'forbidden' ? 'Нет доступа' : code === 'not_found' ? 'Игрок не найден' : 'Ошибка: ' + err.message);
        }
      });
      admBusy = false;
      render();
    }

    function floatText(x, y, text, dia) {
      const el = document.createElement('div');
      el.className = 'float' + (dia ? ' dia' : '');
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

    function onTap(e) {
      const now = performance.now();
      if (!S || now - lastTap < 100) return; // не чаще 10 раз в секунду
      lastTap = now;

      const d = display();
      if (!d.queue.length) return;
      const vein = mine.veins[d.queue[0]];

      unsent += 1;
      if (vein.mult > 0) floatText(e.clientX, e.clientY - 30, '+' + fmt(effMods().clickGold * vein.mult), false);
      else floatText(e.clientX, e.clientY - 30, '◆', true);
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      render();
      if (unsent >= 20) flush();
    }

    async function doFlush(keepalive) {
      if (!unsent || !S) return;
      inflight = unsent;
      unsent = 0;
      try {
        const data = await api('/api/click', 'POST', { clicks: inflight }, keepalive);
        inflight = 0;
        applyServer(data);
        statusEl.textContent = '';
      } catch (err) {
        unsent += inflight;
        inflight = 0;
        statusEl.textContent = 'Нет связи, пробую снова...';
      }
      render();
    }
    const flush = (keepalive) => enqueue(() => doFlush(keepalive));

    // Редкая синхронизация, чтобы подтянуть доход шахтёров и поправить расхождения.
    async function doSync() {
      try {
        applyServer(await api('/api/state', 'GET'));
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Нет связи, пробую снова...';
      }
      render();
    }

    async function hire(count) {
      await flush();
      await enqueue(async () => {
        try {
          applyServer(await api('/api/hire', 'POST', { count }));
          statusEl.textContent = '';
        } catch (err) {
          const code = err.data && err.data.error;
          statusEl.textContent =
            code === 'not_enough_gold' ? 'Не хватает золота' :
            code === 'limit' ? 'Больше нанять нельзя' : 'Не удалось нанять';
          await doSync();
        }
        render();
      });
    }

    async function init() {
      try {
        applyServer(await api('/api/state', 'GET'));
      } catch (err) {
        statusEl.textContent = 'Не удалось связаться с сервером: ' + (err.message || err);
        return;
      }
      const pips = $('pips');
      for (let i = 0; i < mine.clicksPerVein; i++) {
        const p = document.createElement('div');
        p.className = 'pip';
        pips.appendChild(p);
      }
      statusEl.textContent = '';
      render();

      $('rock').addEventListener('pointerdown', onTap);
      $('rock').addEventListener('contextmenu', (e) => e.preventDefault());
      $('hire1').addEventListener('click', () => hire(1));
      $('hireMax').addEventListener('click', () => {
        const c = maxAffordable(display());
        if (c >= 2) hire(c);
      });
      $('modalOk').addEventListener('click', () => { $('modal').hidden = true; });
      $('tabMine').addEventListener('click', () => showView('mine'));
      $('tabSmelter').addEventListener('click', () => showView('smelter'));
      $('tabTree').addEventListener('click', () => showView('tree'));
      $('tabAdmin').addEventListener('click', () => showView('admin'));
      $('btnCast').addEventListener('click', () => smeltAction('cast'));
      $('btnCool').addEventListener('click', () => smeltAction('cool'));
      $('btnPolish').addEventListener('click', () => smeltAction('polish'));
      $('hireSmith1').addEventListener('click', () => hireSmith(1));
      $('hireSmithMax').addEventListener('click', () => {
        const c = maxAffordableSmiths(display());
        if (c >= 2) hireSmith(c);
      });

      setInterval(() => flush(false), 1000);
      setInterval(() => enqueue(doSync), 20000);
      setInterval(render, 250);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flush(true);
        else enqueue(doSync);
      });
    }
    init();
  </script>
</body>
</html>
